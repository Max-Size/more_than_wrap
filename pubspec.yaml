name: more_than_wrap
description: "A Flutter package that provides a custom Wrap widget with limited number of rows and optional overflow widget display."
version: 1.0.0
homepage: https://github.com/Max-Size/more_than_wrap
repository: https://github.com/Max-Size/more_than_wrap
issue_tracker: https://github.com/Max-Size/more_than_wrap/issues

topics:
  - widget
  - layout
  - wrap
  - chips
  - overflow

screenshots:
  - description: Chip tags capped at two rows with a real +N more overflow child.
    path: screenshots/overflow-chips.png

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
